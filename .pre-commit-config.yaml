# Runs checks on each commit after `pre-commit install`: lint and formatting,
# and blocks commits made directly on main (work on a branch instead).
# Dependabot doesn't update these versions: run `pre-commit autoupdate`.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-yaml
        # Checks syntax only, so mkdocs.yml's !!python/name tags don't fail it.
        args: [--unsafe]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: no-commit-to-branch # main and master
      - id: trailing-whitespace
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout # notebook outputs can be large or show unpublished data
  - repo: local
    hooks:
      - id: no-data-files
        name: no data, images, model weights or large files
        entry: python .github/tools/check_repository_files.py
        language: python
