site_name: vem-project
site_description: One-line description of what this tool does for volume EM / CLEM data.
site_url: https://ccp-volume-em.github.io/vem-project/
repo_url: https://github.com/ccp-volume-em/vem-project
repo_name: vem-project

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Usage: usage.md
  - API reference: reference.md
  - Decisions: decisions.md
  - Development: development.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false

markdown_extensions:
  - admonition
  # Reuses README sections (between --8<-- markers) so they're written once.
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
