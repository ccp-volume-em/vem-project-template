# Lint and test on every pull request and on main, on Linux, macOS and Windows.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older runs. Runs on main always
# finish, because a cancelled run shows as failing on the README badge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install ruff
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  test:
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install ".[test]"
      - name: Run tests
        run: python -m pytest -v --cov --cov-report=term-missing

  # The one test check that the rule protecting main requires
  # (.github/rulesets/main.json), so the rule needn't list every platform and
  # Python version, and keeps working when the matrix changes.
  all-tests:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = success
