# Build the container image and check that it starts. Runs when the image's
# inputs change, and weekly to catch breakage from upstream updates.
# On a release tag it can also publish the image to the GitHub Container
# Registry: set the repository variable PUBLISH_CONTAINER to "true".
name: Container

on:
  pull_request:
    paths: [Dockerfile, .dockerignore, pyproject.toml, "src/**", .github/workflows/container.yml]
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: >
          docker build
          --build-arg VERSION=${{ github.ref_name }}
          --build-arg REVISION=${{ github.sha }}
          --tag image-under-test .
      - name: Starts and reports its version
        run: docker run --rm image-under-test --version
      - name: Shows help
        run: docker run --rm image-under-test --help

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_CONTAINER == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag image-under-test "$image"
          docker push "$image"
