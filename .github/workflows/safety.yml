# Block the two mistakes that are hardest to undo, because they stay in the
# git history: committing data or large files, and committing secrets
# (passwords, tokens, keys).
name: Safety checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-data-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: No data, images, model weights or large files
        run: python .github/tools/check_repository_files.py

  no-secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the whole history, since a secret in any commit is exposed
      # The official gitleaks Action needs a licence key for organisation
      # repositories, so install the released binary and check its checksum.
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}" gitleaks
          ./gitleaks version
      - name: Check gitleaks detects a secret
        # A token made up at run time, so nothing secret-looking is stored in
        # the repository; if gitleaks stops detecting it, this step fails.
        run: |
          mkdir -p "$RUNNER_TEMP/canary"
          echo "token = ghp_$(head -c 200 /dev/urandom | tr -dc 'A-Za-z0-9' | head -c 36)" > "$RUNNER_TEMP/canary/config.txt"
          if ./gitleaks dir "$RUNNER_TEMP/canary" --no-banner --redact; then
            echo "::error::gitleaks didn't detect a test token"
            exit 1
          fi
      - name: No secrets in any commit
        run: ./gitleaks git . --no-banner --redact --verbose
