# Runs when a version tag (e.g. v1.2.0) is pushed. Checks the tag matches the
# package version, builds and tests the package, and creates a GitHub Release
# with the changelog section as release notes.
# To also publish to PyPI: set up Trusted Publishing on pypi.org for this
# workflow and an environment called "pypi", then set the repository variable
# PUBLISH_TO_PYPI to "true". See guidance/publishing.md.
# In the project template itself, a tag only publishes the release notes: the
# template's pyproject.toml stays at 0.0.0 for the projects made from it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  kind:
    runs-on: ubuntu-latest
    outputs:
      is-template: ${{ steps.check.outputs.is-template }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "is-template=$(gh api "repos/$GITHUB_REPOSITORY" --jq .is_template)" >> "$GITHUB_OUTPUT"

  build:
    needs: kind
    if: needs.kind.outputs.is-template != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Tag matches the version in pyproject.toml
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in pyproject.toml"
            exit 1
          fi
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Test the built wheel, not the source checkout
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/python -m pip install dist/*.whl pytest
          /tmp/wheel-env/bin/python -m pytest tests
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]*\]: / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag

  template-release:
    needs: kind
    if: needs.kind.outputs.is-template == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create the GitHub Release with notes only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]*\]: / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --title "Template $GITHUB_REF_NAME" --notes-file notes.md --verify-tag

  pypi:
    needs: build
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
