name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: The command or code you ran, and the parameter file if any. Describe the data (format, size, voxel size); please don't attach unpublished data.
      render: shell
  - type: textarea
    id: error
    attributes:
      label: Error message or output
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `vem-project --version`
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, and whether you used a container or HPC
